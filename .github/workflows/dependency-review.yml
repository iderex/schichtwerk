name: Dependency review

on:
  pull_request:

# Read-only: the dependency-review action only inspects the PR diff against the
# advisory database, it never writes to the repo.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # No `name:` on this job: a required status check is matched by the literal
  # check-run name, which defaults to the job id ("dependency-review") when no
  # `name:` is set. Setting one here renames the check run, and a rule naming
  # the old name then matches nothing while staying green.
  #
  # Nothing requires this check yet. The ruleset on this repository is `gate`,
  # and it carries no required status checks:
  #
  #   gh api repos/iderex/schichtwerk/rulesets --jq '.[] | "\(.id) \(.name)"'
  #   20522959 gate
  #   gh api repos/iderex/schichtwerk/rulesets/20522959 \
  #     --jq '[.rules[]|select(.type=="required_status_checks")|.parameters.required_status_checks[].context]'
  #   []
  #
  # Derived 2026-08-09. That is a reason to fix the name before a requirement
  # exists rather than after it. Issue #18 is where the requirement is prepared.
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Fail closed: any known vulnerability in a newly introduced or
          # upgraded dependency blocks the PR. Relax only with a documented
          # reason.
          fail-on-severity: low
